name: Keep Backend Awake
on:
  schedule:
    # dakika 3'ten baslayip her 10 dk'da bir (saat basi :00 cakismasindan kacinir)
    - cron: '3/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -f -sS --max-time 90 https://mizan-backend-rtl5.onrender.com/health || echo "cold start ok"
