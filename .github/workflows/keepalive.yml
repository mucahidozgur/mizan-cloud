name: Keep Backend Awake
on:
  schedule:
    # :00/:10 gibi saat baslarindan kacinir (GitHub cron'larinda en yogun slotlar)
    - cron: '3-53/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -f -sS --max-time 90 https://mizan-backend-rtl5.onrender.com/health || echo "cold start ok"
